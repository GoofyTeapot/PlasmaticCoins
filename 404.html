<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const path = window.location.pathname;

    // Only intercept /PlasmaticCoins/buy/*
    if (path.startsWith("/PlasmaticCoins/buy/")) {

      // Load the dynamic buy page WITHOUT changing the URL
      fetch("/PlasmaticCoins/buy/index.html")
        .then(res => res.text())
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        });
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
