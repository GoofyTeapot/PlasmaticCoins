<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Get the actual path GitHub Pages thinks you're on
    const path = window.location.pathname;

    // If URL starts with /PlasmaticCoins/buy/
    if (path.startsWith("/PlasmaticCoins/buy/")) {
      // Preserve real query string and hash
      const qs = window.location.search;
      const hash = window.location.hash;

      // Redirect to the dynamic buy page
      window.location.replace("/PlasmaticCoins/buy/index.html" + qs + hash);
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
