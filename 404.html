<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA Router
    const path = window.location.pathname;

    // If URL starts with /PlasmaticCoins/buy/
    if (path.startsWith("/PlasmaticCoins/buy/")) {
      // Redirect to /buy/index.html but keep the original URL
      window.location.replace("/PlasmaticCoins/buy/index.html" + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
