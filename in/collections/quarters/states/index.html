  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById("clock").textContent = time;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCk1kUcNl8-U1IW7jL_K3H_Wm2vhaZTCA",
      authDomain: "plasmaticcoins-server.firebaseapp.com",
      projectId: "plasmaticcoins-server",
      storageBucket: "plasmaticcoins-server.firebasestorage.app",
      messagingSenderId: "148763283032",
      appId: "1:148763283032:web:e547227225642fa226c42d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const checkboxes = document.querySelectorAll("input[type='checkbox'][data-id]");
    const totalDisplay = document.getElementById("totalDisplay");
    const progressBar = document.getElementById("progressBar");

    let currentUser = null;

    function updateProgress() {
      const total = 50;
      const collected = [...checkboxes].filter(cb => cb.checked).length;

      totalDisplay.textContent = `${collected} / ${total} collected`;
      progressBar.style.width = `${(collected / total) * 100}%`;
    }

    async function saveProgress() {
      if (!currentUser) return;

      const collected = {};
      checkboxes.forEach(cb => {
        collected[cb.dataset.id] = cb.checked;
      });

      await setDoc(
        doc(db, "users", currentUser.uid, "collections", "stateQuarters"),
        collected,
        { merge: true }
      );
    }

    async function loadProgress() {
      if (!currentUser) return;

      const ref = doc(db, "users", currentUser.uid, "collections", "stateQuarters");
      const snap = await getDoc(ref);

      if (snap.exists()) {
        const data = snap.data();
        checkboxes.forEach(cb => {
          if (data[cb.dataset.id] === true) {
            cb.checked = true;
          }
        });
      }

      updateProgress();
    }

    checkboxes.forEach(cb => {
      cb.addEventListener("change", () => {
        updateProgress();
        saveProgress();
      });
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert("You must be signed in to track your collection.");
        return;
      }

      currentUser = user;
      await loadProgress();
    });
  </script>
