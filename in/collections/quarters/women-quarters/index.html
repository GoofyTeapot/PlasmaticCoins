<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>American Women Quarters Checklist - PlasmaticCoins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../../../../img/logo.png">
  <link rel="stylesheet" href="../../../../css/styles.css" />

  <style>
    .progress-container {
      width: 100%;
      background: #ddd;
      border-radius: 8px;
      overflow: hidden;
      margin: 1rem 0;
    }
    .progress-bar {
      height: 20px;
      background: #4682B4;
      width: 0%;
      transition: width 0.3s ease;
    }
    .total-display {
      font-weight: bold;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">
        <img src="../../../../img/logo.png" class="inline-icon">
        Plasmatic Coins
      </h1>

      <div id="nav-placeholder"></div>

      <script>
        fetch("../../../../includes/nav.html")
        .then(res => res.text())
            .then(html => {
              document.getElementById("nav-placeholder").innerHTML = html;
            });
      </script>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>American Women Quarters Checklist</h2>
      <p>Track your collection of all 20 American Women Quarters (2022–2025).</p>

      <div class="total-display" id="totalDisplay">0 / 20 collected</div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </section>

    <!-- 2022 -->
    <section class="card">
      <h3>2022</h3>
      <label><input type="checkbox" data-id="MAH"> Maya Angelou</label><br>
      <label><input type="checkbox" data-id="RSB"> Dr. Sally Ride</label><br>
      <label><input type="checkbox" data-id="WIL"> Wilma Mankiller</label><br>
      <label><input type="checkbox" data-id="NIN"> Nina Otero-Warren</label><br>
      <label><input type="checkbox" data-id="JAD"> Anna May Wong</label>
    </section>

    <!-- 2023 -->
    <section class="card">
      <h3>2023</h3>
      <label><input type="checkbox" data-id="BES"> Bessie Coleman</label><br>
      <label><input type="checkbox" data-id="EDM"> Edith Kanakaʻole</label><br>
      <label><input type="checkbox" data-id="JOV"> Jovita Idar</label><br>
      <label><input type="checkbox" data-id="FRA"> Eleanor Roosevelt</label><br>
      <label><input type="checkbox" data-id="HIP"> Maria Tallchief</label>
    </section>

    <!-- 2024 -->
    <section class="card">
      <h3>2024</h3>
      <label><input type="checkbox" data-id="PAU"> Patsy Takemoto Mink</label><br>
      <label><input type="checkbox" data-id="ZEN"> Dr. Mary Edwards Walker</label><br>
      <label><input type="checkbox" data-id="IDA"> Ida B. Wells</label><br>
      <label><input type="checkbox" data-id="CEL"> Celia Cruz</label><br>
      <label><input type="checkbox" data-id="GAB"> Zitkala-Ša</label>
    </section>

    <!-- 2025 -->
    <section class="card">
      <h3>2025</h3>
      <label><input type="checkbox" data-id="KAT"> Katherine Johnson</label><br>
      <label><input type="checkbox" data-id="ROS"> Rosa Parks</label><br>
      <label><input type="checkbox" data-id="AMY"> Amelia Earhart</label><br>
      <label><input type="checkbox" data-id="HOP"> Grace Hopper</label><br>
      <label><input type="checkbox" data-id="TON"> Toni Morrison</label>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Plasmatic Coins</p>
    </div>
  </footer>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById("clock").textContent = time;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCk1kUcNl8-U1IW7jL_K3H_Wm2vhaZTCA",
      authDomain: "plasmaticcoins-server.firebaseapp.com",
      projectId: "plasmaticcoins-server",
      storageBucket: "plasmaticcoins-server.firebasestorage.app",
      messagingSenderId: "148763283032",
      appId: "1:148763283032:web:e547227225642fa226c42d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const checkboxes = document.querySelectorAll("input[type='checkbox'][data-id]");
    const totalDisplay = document.getElementById("totalDisplay");
    const progressBar = document.getElementById("progressBar");

    let currentUser = null;

    function updateProgress() {
      const total = 20;
      const collected = [...checkboxes].filter(cb => cb.checked).length;

      totalDisplay.textContent = `${collected} / ${total} collected`;
      progressBar.style.width = `${(collected / total) * 100}%`;
    }

    async function saveProgress() {
      if (!currentUser) return;

      const collected = {};
      checkboxes.forEach(cb => {
        collected[cb.dataset.id] = cb.checked;
      });

      await setDoc(
        doc(db, "users", currentUser.uid, "collections", "womenQuarters"),
        collected,
        { merge: true }
      );
    }

    async function loadProgress() {
      if (!currentUser) return;

      const ref = doc(db, "users", currentUser.uid, "collections", "womenQuarters");
      const snap = await getDoc(ref);

      if (snap.exists()) {
        const data = snap.data();
        checkboxes.forEach(cb => {
          if (data[cb.dataset.id] === true) {
            cb.checked = true;
          }
        });
      }

      updateProgress();
    }

    checkboxes.forEach(cb => {
      cb.addEventListener("change", () => {
        updateProgress();
        saveProgress();
      });
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert("You must be signed in to track your collection.");
        return;
      }

      currentUser = user;
      await loadProgress();
    });
  </script>

</body>
</html>
