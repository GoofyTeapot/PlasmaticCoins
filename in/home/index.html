<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Template Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">My Website</h1>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Welcome to the template</h2>
      <p>
        This is a simple starter layout using <code>#4682B4</code> as the accent color.
      </p>
      <button class="btn-primary">Get Started</button>
    </section>

    <section class="card-grid">
      <article class="card">
        <h3>Card One</h3>
        <p>Some sample text for this card.</p>
      </article>
      <article class="card">
        <h3>Card Two</h3>
        <p>Another bit of placeholder content.</p>
      </article>
      <article class="card">
        <h3>Card Three</h3>
        <p>More text to fill out the layout.</p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 My Website</p>
    </div>
  </footer>
</body>
</html>
